# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
      
      # Create example files for demonstration
      - name: Create example files
        run: |
          mkdir -p build-output
          echo "Build completed at $(date)" > build-output/build-info.txt
          echo "Example build artifact" > build-output/artifact.txt
      
      # Upload artifacts to GitHub Actions
      # LOCATION: Artifacts are uploaded to GitHub Actions and can be accessed at:
      # https://github.com/{owner}/{repo}/actions/runs/{run_id}
      # They are stored for 90 days by default and can be downloaded from the workflow run page
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build-output/
          retention-days: 90  # Files are kept for 90 days
          # The uploaded files can be found at:
          # Repository → Actions → Select workflow run → Artifacts section at bottom of page
